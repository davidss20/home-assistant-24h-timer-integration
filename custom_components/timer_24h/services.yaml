toggle_slot:
  name: Toggle time slot
  description: Toggle a half-hour time slot on or off.
  fields:
    entity_id:
      name: Timer entity
      description: The Timer 24H sensor entity.
      required: true
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    hour:
      name: Hour
      description: Hour of the day (0-23).
      required: true
      example: 8
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      description: Minute of the slot (0 or 30).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 30
          step: 30
          mode: box

set_slots:
  name: Set time slots
  description: Set multiple time slots at once.
  fields:
    entity_id:
      name: Timer entity
      description: The Timer 24H sensor entity.
      required: true
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    slots:
      name: Slots
      description: List of slot objects with hour, minute, and isActive.
      required: true
      example: '[{"hour": 8, "minute": 0, "isActive": true}]'
      selector:
        object:

clear_all:
  name: Clear all slots
  description: Clear all active time slots.
  fields:
    entity_id:
      name: Timer entity
      description: The Timer 24H sensor entity.
      required: true
      selector:
        entity:
          integration: timer_24h
          domain: sensor

set_enabled:
  name: Set enabled
  description: Enable or disable timer entity control.
  fields:
    entity_id:
      name: Timer entity
      description: The Timer 24H sensor entity.
      required: true
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    enabled:
      name: Enabled
      description: Whether the timer should control entities.
      required: true
      selector:
        boolean:

set_entity_settings:
  name: Set entity settings
  description: Set climate/fan settings applied when the timer turns an entity on.
  fields:
    entity_id:
      name: Timer entity
      description: The Timer 24H sensor entity.
      required: true
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    target_entity_id:
      name: Target entity
      description: The climate or fan entity to configure.
      required: true
      selector:
        entity:
          domain:
            - climate
            - fan
    temperature:
      name: Temperature
      description: Target temperature for climate entities.
      required: false
      selector:
        number:
          min: 10
          max: 35
          step: 0.5
          mode: box
    hvac_mode:
      name: HVAC mode
      description: HVAC mode for climate entities (cool, heat, auto, dry, fan_only).
      required: false
      selector:
        text:
    percentage:
      name: Fan percentage
      description: Speed percentage for fan entities (0-100).
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box
