<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer 24H — דמו 15 דקות</title>
  <!-- preview-15min-ux-v10 -->
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #212121;
      --muted: #6b7280;
      --line: #e5e7eb;
      --green: #10b981;
      --select: #3b82f6;
      --now: #ff6b6b;
      --quarter: #6366f1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 460px; margin: 0 auto; padding: 20px 12px 48px; }
    h1 { font-size: 1.25rem; margin: 0 0 6px; text-align: center; }
    p.lead { color: var(--muted); text-align: center; margin: 0 0 16px; font-size: 0.92rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 8px 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px 2px;
      font-weight: 700;
    }
    .status {
      font-size: 12px;
      color: #059669;
      background: #d1fae5;
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 600;
    }
    .row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 8px 2px;
    }
    .row label {
      width: 100%;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .seg button {
      min-width: 92px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      background: #f3f4f6;
      color: var(--muted);
      cursor: pointer;
    }
    .seg button:first-child {
      border-start-start-radius: 8px;
      border-end-start-radius: 8px;
    }
    .seg button:last-child {
      border-start-end-radius: 8px;
      border-end-end-radius: 8px;
      margin-inline-start: -1px;
    }
    .seg button.active {
      background: var(--select);
      border-color: var(--select);
      color: #fff;
    }
    #opts15 { display: none; }
    #opts15.show { display: block; }
    svg.clock {
      width: 100%;
      height: auto;
      display: block;
      touch-action: manipulation;
      direction: ltr;
      unicode-bidi: isolate;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    svg.clock path { cursor: pointer; }
    svg.clock text { direction: ltr; unicode-bidi: isolate; }
    .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 10px 8px 0; min-height: 2.6em; }
    .action {
      text-align: center;
      font-size: 0.78rem;
      font-family: ui-monospace, Consolas, monospace;
      color: var(--select);
      min-height: 1.2em;
      margin: 4px 8px 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Timer 24H</h1>
    <p class="lead">לחיצה על רבע מסמנת רק אותו. לחיצה ארוכה מסמנת את כל השעה. כמו בכרטיס עצמו.</p>
    <div class="card">
      <div class="header">
        <span>תאורה חכמה</span>
        <span class="status">פעיל</span>
      </div>
      <div class="row seg" id="modeRow">
        <button type="button" id="btn15" class="active">15 דק׳</button>
        <button type="button" id="btn30">30 דק׳</button>
      </div>
      <div id="opts15">
        <div class="row seg">
          <label>תוויות רבעים (15 / 30 / 45)</label>
          <button type="button" id="lblAlways" class="active">תמיד</button>
          <button type="button" id="lblFocus">רק בלחיצה</button>
        </div>
      </div>
      <div id="stage"></div>
      <p class="action" id="action"></p>
      <p class="hint" id="hint"></p>
    </div>
  </main>
  <script>
    const CX = 200, CY = 200, R_OUT = 180, R_MID = 115, R_IN = 50;
    const GREEN = "#10b981", WHITE = "#ffffff", INK = "#374151", MUTED = "#6b7280";
    const STROKE = "#e5e7eb", SELECT = "#3b82f6", NOW = "#ff6b6b";
    const HOUR = "#0f172a";
    const QUARTER = "#4338ca";
    const BANDS = [
      { m: 0, a: 147.5, b: 180 },
      { m: 15, a: 115, b: 147.5 },
      { m: 30, a: 82.5, b: 115 },
      { m: 45, a: 50, b: 82.5 }
    ];
    const on = new Set();
    for (const h of [6, 7, 8, 11, 18, 19, 20, 21]) {
      for (const m of [0, 15, 30, 45]) on.add(h + ":" + m);
    }
    on.add("12:0");
    on.add("12:30");
    let mode = 15;
    let focused = 12;
    let labels = "always";
    let lastAction = "";
    let pressTimer = null;
    let pressSlot = null;
    let longPressDone = false;
    function pad(n) { return String(n).padStart(2, "0"); }
    function key(h, m) { return h + ":" + m; }
    function has(h, m) { return on.has(key(h, m)); }
    function label(h, m) { return pad(h) + ":" + pad(m); }
    function nowSlot() {
      const d = new Date();
      return { h: d.getHours(), m: Math.floor(d.getMinutes() / 15) * 15 };
    }
    function sector(i, n, rIn, rOut) {
      const a0 = (i * 360 / n - 90) * Math.PI / 180;
      const a1 = ((i + 1) * 360 / n - 90) * Math.PI / 180;
      const x1 = CX + rIn * Math.cos(a0), y1 = CY + rIn * Math.sin(a0);
      const x2 = CX + rOut * Math.cos(a0), y2 = CY + rOut * Math.sin(a0);
      const x3 = CX + rOut * Math.cos(a1), y3 = CY + rOut * Math.sin(a1);
      const x4 = CX + rIn * Math.cos(a1), y4 = CY + rIn * Math.sin(a1);
      const large = (a1 - a0) <= Math.PI ? 0 : 1;
      return `M ${x1} ${y1} L ${x2} ${y2} A ${rOut} ${rOut} 0 ${large} 1 ${x3} ${y3} L ${x4} ${y4} A ${rIn} ${rIn} 0 ${large} 0 ${x1} ${y1}`;
    }
    function textPos(i, n, r) {
      const a = ((i + 0.5) * 360 / n - 90) * Math.PI / 180;
      return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
    }
    function rot(i, n) {
      let deg = (i + 0.5) * (360 / n) - 90;
      if (deg > 90 || deg < -90) deg += 180;
      return deg;
    }
    function textEl(i, n, r, str, size, fill, weight, followWedge) {
      const p = textPos(i, n, r);
      const deg = followWedge ? rot(i, n) : 0;
      return `<g transform="translate(${p.x} ${p.y}) rotate(${deg})" style="pointer-events:none">
        <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="${size}"
          font-weight="${weight || 700}" fill="${fill}" style="direction:ltr; unicode-bidi:isolate">${str}</text>
      </g>`;
    }
    function contrastOn(active) {
      return active ? "#ffffff" : HOUR;
    }
    function toggle(h, minutes) {
      const allOn = minutes.every((m) => has(h, m));
      minutes.forEach((m) => {
        const k = key(h, m);
        if (allOn) on.delete(k); else on.add(k);
      });
    }
    function toggleHour(h) {
      toggle(h, [0, 15, 30, 45]);
      const allOn = [0, 15, 30, 45].every((m) => has(h, m));
      lastAction = allOn
        ? "שעה שלמה " + pad(h) + ":00–" + pad(h) + ":45"
        : "בוטלה שעה " + pad(h);
    }
    function toggleQuarter(h, m) {
      toggle(h, [m]);
      lastAction = (has(h, m) ? "סומן " : "בוטל ") + label(h, m);
    }
    function hintText() {
      if (mode === 30) return "טבעת חיצונית = השעה. טבעת פנימית = חצי השעה. אדום = עכשיו.";
      const labelsHint = labels === "always"
        ? "הזמנים 15 / 30 / 45 מוצגים תמיד, קטנים ובסגול."
        : "הזמנים 15 / 30 / 45 מוצגים רק בשעה האחרונה שלחצתם.";
      return "לחיצה קצרה על רבע מסמנת רק אותו. לחיצה ארוכה מסמנת/מבטלת את כל השעה. " + labelsHint;
    }
    function render() {
      document.getElementById("opts15").classList.toggle("show", mode === 15);
      const now = nowSlot();
      let html = `<svg class="clock" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" direction="ltr">
        <circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="none" stroke="${STROKE}" stroke-width="2"/>
        <circle cx="${CX}" cy="${CY}" r="${R_MID}" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
        <circle cx="${CX}" cy="${CY}" r="${R_IN}" fill="none" stroke="${STROKE}" stroke-width="2"/>`;
      for (let i = 0; i < 24; i++) {
        const a = (i * 360 / 24 - 90) * Math.PI / 180;
        html += `<line x1="${CX + R_IN * Math.cos(a)}" y1="${CY + R_IN * Math.sin(a)}"
          x2="${CX + R_OUT * Math.cos(a)}" y2="${CY + R_OUT * Math.sin(a)}" stroke="${STROKE}"/>`;
      }
      if (mode === 15) {
        for (let h = 0; h < 24; h++) {
          const showLabels = labels === "always" || focused === h;
          for (const band of BANDS) {
            const active = has(h, band.m);
            const sel = focused === h;
            html += `<path d="${sector(h, 24, band.a, band.b)}" fill="${active ? GREEN : WHITE}"
              stroke="${sel ? SELECT : STROKE}" stroke-width="${sel ? 2 : 1}"
              data-h="${h}" data-m="${band.m}"/>`;
            if (showLabels && band.m !== 0) {
              html += textEl(
                h, 24, (band.a + band.b) / 2, String(band.m), 9.5,
                active ? "#ffffff" : QUARTER, 700, false
              );
            }
          }
        }
        for (let h = 0; h < 24; h++) {
          html += textEl(h, 24, 166, pad(h), 13, contrastOn(has(h, 0)), 800, false);
        }
      } else {
        const rings = [
          { pair: 0, minutes: [0, 15], a: R_MID, b: R_OUT },
          { pair: 30, minutes: [30, 45], a: R_IN, b: R_MID }
        ];
        for (let h = 0; h < 24; h++) {
          for (const ring of rings) {
            const active = ring.minutes.every((m) => has(h, m));
            const fill = active ? GREEN : (ring.pair === 0 ? WHITE : "#f8f9fa");
            html += `<path d="${sector(h, 24, ring.a, ring.b)}" fill="${fill}" stroke="${STROKE}"
              stroke-width="1" data-h="${h}" data-m="${ring.pair}"/>`;
          }
          html += textEl(h, 24, (R_MID + R_OUT) / 2, pad(h) + ":00", 11, contrastOn(has(h, 0) && has(h, 15)), 700, true);
          html += textEl(h, 24, (R_IN + R_MID) / 2, pad(h) + ":30", 9, has(h, 30) && has(h, 45) ? "#fff" : MUTED, 700, true);
        }
      }
      const nowBand = BANDS.find((b) => b.m === now.m);
      if (mode === 15) {
        html += `<path d="${sector(now.h, 24, nowBand.a, nowBand.b)}" fill="none" stroke="${NOW}" stroke-width="4" pointer-events="none"/>`;
      } else {
        const a = now.m < 30 ? R_MID : R_IN;
        const b = now.m < 30 ? R_OUT : R_MID;
        html += `<path d="${sector(now.h, 24, a, b)}" fill="none" stroke="${NOW}" stroke-width="5" pointer-events="none"/>`;
      }
      html += `<circle cx="${CX}" cy="${CY}" r="${R_IN}" fill="${GREEN}"/>
        <text x="${CX}" y="${CY + 5}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" style="pointer-events:none">ON</text>
        <text x="${CX}" y="${CY + 22}" text-anchor="middle" font-size="9" fill="#fff" opacity="0.9" style="pointer-events:none">1 entity</text>
      </svg>`;
      document.getElementById("stage").innerHTML = html;
      document.getElementById("hint").textContent = hintText();
      document.getElementById("action").textContent = lastAction;
    }
    function pathFromEvent(ev) {
      const path = ev.target.closest("path");
      if (!path || path.dataset.h === undefined) return null;
      return { h: Number(path.dataset.h), m: Number(path.dataset.m) };
    }
    function handleTap(h, m) {
      focused = h;
      if (mode === 30) {
        toggle(h, m === 0 ? [0, 15] : [30, 45]);
        lastAction = (m === 0 ? label(h, 0) : label(h, 30));
      } else {
        toggleQuarter(h, m);
      }
      render();
    }
    function bindClock() {
      const stage = document.getElementById("stage");
      stage.addEventListener("pointerdown", (ev) => {
        const slot = pathFromEvent(ev);
        if (!slot) return;
        pressSlot = slot;
        longPressDone = false;
        if (mode !== 15) return;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          if (!pressSlot) return;
          longPressDone = true;
          focused = pressSlot.h;
          toggleHour(pressSlot.h);
          render();
        }, 520);
      });
      const finishPointer = (ev) => {
        clearTimeout(pressTimer);
        pressTimer = null;
        if (longPressDone) {
          longPressDone = false;
          pressSlot = null;
          ev.preventDefault();
          return;
        }
        const slot = pathFromEvent(ev) || pressSlot;
        pressSlot = null;
        if (!slot) return;
        handleTap(slot.h, slot.m);
      };
      document.addEventListener("pointerup", finishPointer);
      document.addEventListener("pointercancel", () => {
        clearTimeout(pressTimer);
        pressTimer = null;
        longPressDone = false;
        pressSlot = null;
      });
      stage.addEventListener("contextmenu", (ev) => ev.preventDefault());
    }
    function setActive(id, on) {
      document.getElementById(id).classList.toggle("active", on);
    }
    document.getElementById("btn15").onclick = () => {
      mode = 15;
      setActive("btn15", true);
      setActive("btn30", false);
      lastAction = "";
      render();
    };
    document.getElementById("btn30").onclick = () => {
      mode = 30;
      focused = null;
      setActive("btn15", false);
      setActive("btn30", true);
      lastAction = "";
      render();
    };
    document.getElementById("lblAlways").onclick = () => {
      labels = "always";
      setActive("lblAlways", true);
      setActive("lblFocus", false);
      render();
    };
    document.getElementById("lblFocus").onclick = () => {
      labels = "focus";
      setActive("lblAlways", false);
      setActive("lblFocus", true);
      render();
    };
    bindClock();
    render();
    setInterval(render, 15000);
  </script>
</body>
</html>
